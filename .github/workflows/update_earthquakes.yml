name: Update Earthquake Data

on:
  schedule:
    - cron: '0 16 * * 0' # 每周日 16:00 UTC (北京时间周日 24:00)
  workflow_dispatch: # 允许手动触发

# 显式声明权限，确保可以推送代码
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests matplotlib numpy obspy

      - name: Create images directory if not exists
        run: mkdir -p images

      - name: Fetch USGS data and generate beachballs
        run: python fetch_data.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json images/
          # 如果没有变化则不报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update earthquake data and beachballs" && git push)
